# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Generate with:  cd apps/ios && xcodegen
# The .xcodeproj is generated, not hand-edited, so this file is the single source of project configuration.
name: DryRun
options:
  bundleIdPrefix: org.example.dryrun
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  DryRunCore:
    path: ../../packages/DryRunCore
  DryRunVault:
    path: ../../packages/DryRunVault
targets:
  DryRun:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DryRun
        excludes:
          - "Resources/Info.plist"
          - "Resources/DryRun.entitlements"
      - path: ../../content
        type: folder
        buildPhase: resources
    dependencies:
      - package: DryRunCore
      - package: DryRunVault
      - sdk: RoomPlan.framework
        weak: true
      # iOS 26+ only; weak-linked so the iOS 18 deployment target launches without it.
      - sdk: FoundationModels.framework
        weak: true
    info:
      path: DryRun/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dry Run
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Dry Run uses the camera only while you scan rooms with RoomPlan. The scan stays on this device."
        NSLocationWhenInUseUsageDescription: "Optional: show your position on the help map. Dry Run does not send your location to its server."
        CFBundleLocalizations: [en, es, vi]
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
    entitlements:
      path: DryRun/Resources/DryRun.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.dryrun.app
        TARGETED_DEVICE_FAMILY: "1"
  DryRunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DryRunUITests]
    dependencies:
      - target: DryRun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DryRun
schemes:
  DryRun:
    build:
      targets:
        DryRun: all
    test:
      targets: [DryRunUITests]
