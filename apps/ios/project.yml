# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Generate with:  cd apps/ios && xcodegen
# The .xcodeproj is generated, not hand-edited, so this file is the single source of project configuration.
name: DryRun
options:
  bundleIdPrefix: org.example.dryrun
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # One place for the app's bundle ID. Device scripts override it with DRYRUN_BUNDLE_ID=com.<you>.dryrun on the
    # xcodebuild command line; overriding PRODUCT_BUNDLE_IDENTIFIER there would give the UI-test bundle the same ID.
    DRYRUN_BUNDLE_ID: org.example.dryrun.app
packages:
  DryRunCore:
    path: ../../packages/DryRunCore
  DryRunVault:
    path: ../../packages/DryRunVault
targets:
  DryRun:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DryRun
        excludes:
          - "Resources/Info.plist"
          - "Resources/DryRun.entitlements"
      - path: ../../content
        type: folder
        buildPhase: resources
    dependencies:
      - package: DryRunCore
      - package: DryRunVault
      - sdk: RoomPlan.framework
        weak: true
    info:
      path: DryRun/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dry Run
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Dry Run uses the camera only while you scan rooms with RoomPlan. The scan stays on this device."
        NSLocationWhenInUseUsageDescription: "Optional: use your position for a map planning origin after you ask. Dry Run does not send it to its service; Apple Maps may receive the location for map, search, or travel services."
        CFBundleLocalizations: [en, es, vi]
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
    entitlements:
      path: DryRun/Resources/DryRun.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DRYRUN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        # FoundationModels exists only in the iOS 26 SDK. Listing it as an `sdk:` dependency makes the link fail on
        # Xcode 16 ("framework 'FoundationModels' not found"), so it is weak-linked only when the SDK has it. The Swift
        # side is already gated by `#if canImport(FoundationModels)` and `#available(iOS 26.0, *)`.
        "OTHER_LDFLAGS[sdk=iphoneos26*]": "$(inherited) -weak_framework FoundationModels"
        "OTHER_LDFLAGS[sdk=iphonesimulator26*]": "$(inherited) -weak_framework FoundationModels"
  DryRunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DryRunTests]
    dependencies:
      - target: DryRun
      - package: DryRunCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DRYRUN_BUNDLE_ID).tests
  DryRunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DryRunUITests]
    dependencies:
      - target: DryRun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DryRun
        PRODUCT_BUNDLE_IDENTIFIER: $(DRYRUN_BUNDLE_ID).uitests
schemes:
  DryRun:
    build:
      targets:
        DryRun: all
    test:
      targets: [DryRunTests, DryRunUITests]
