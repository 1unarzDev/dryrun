# Optional cloud Mac: runs the same verification on a GitHub-hosted macOS runner and uploads the artifact bundle.
# Manual trigger only (Actions tab > "iOS verify" > Run workflow). Requires the repo to be pushed to GitHub.
# Simulator only: no signing secrets, no device access, fictional data only.
name: iOS verify
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify (full), build (compile only), or screens (screenshot tour only)"
        default: verify
        type: choice
        options: [verify, build, screens]
      locales:
        description: "Screenshot locales"
        default: "en,es,vi"
      runner:
        description: "macOS runner label (needs Xcode 16.3+; Xcode 26 for Foundation Models)"
        default: macos-15
      xcode:
        description: "Optional Xcode app name, e.g. Xcode_16.4 (empty = runner default)"
        default: ""
      simulator:
        description: "Optional simulator name (for example iPhone SE (3rd generation))"
        default: ""
      xxl:
        description: "Largest accessibility text for screens mode"
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        if: ${{ inputs.xcode != '' }}
        run: sudo xcode-select -s "/Applications/${{ inputs.xcode }}.app"
      - name: Tools
        run: brew install xcodegen
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        env:
          DRYRUN_VERIFY_MODE: ${{ inputs.mode }}
          DRYRUN_VERIFY_LOCALES: ${{ inputs.locales }}
          SIM_NAME: ${{ inputs.simulator }}
          DRYRUN_VERIFY_XXL: ${{ inputs.xxl }}
        run: |
          if [ "$DRYRUN_VERIFY_MODE" = "screens" ]; then
            args=(--locales "$DRYRUN_VERIFY_LOCALES")
            if [ "$DRYRUN_VERIFY_XXL" = true ]; then args+=(--xxl); fi
            scripts/mac/screens.sh "${args[@]}"
          elif [ "$DRYRUN_VERIFY_MODE" = build ]; then
            scripts/mac/verify.sh --build-only
          else
            scripts/mac/verify.sh --locales "$DRYRUN_VERIFY_LOCALES"
          fi
      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-${{ inputs.mode }}-${{ github.run_number }}
          path: artifacts/*.tar.gz
          retention-days: 14
